name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Run Tests
        run: go test ./... -v

      - name: Build Go binary
        run: |
          cd cmd/lambda
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -tags lambda.norpc -o bootstrap .
          ls -la bootstrap

      - name: SAM Deploy
        env:
          ADMIN_USER: ${{ vars.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
          CERTIFICATE_ARN: ${{ vars.CERTIFICATE_ARN_US_EAST_2 }}
          JWT_SIGNING_KEY_ARN: ${{ secrets.JWT_SIGNING_KEY_ARN }}
          WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
          WG_PEER_PUBLIC_KEY: ${{ secrets.WG_PEER_PUBLIC_KEY }}
          WG_PEER_ENDPOINT: ${{ secrets.WG_PEER_ENDPOINT }}
          WG_ADDRESS: ${{ secrets.WG_ADDRESS }}
          WG_DNS: ${{ secrets.WG_DNS }}
          CF_BUCKET: ${{ vars.CLOUDFORMATION_S3_BUCKET }}
          PRINTER_IP: ${{ vars.PRINTER_IP }}
          ALEXA_SKILL_ID: ${{ vars.ALEXA_SKILL_ID }}
        run: |
          python3 << 'PYEOF'
          import os

          params = {
            'AdminUser': os.environ['ADMIN_USER'],
            'AdminPassword': os.environ['ADMIN_PASSWORD'],
            'DomainName': os.environ.get('DOMAIN_NAME', 'mcp-brother-label-printer.jeremy.ninja'),
            'HostedZoneId': os.environ['HOSTED_ZONE_ID'],
            'CertificateArn': os.environ['CERTIFICATE_ARN'],
            'OtelEndpoint': 'http://192.168.1.202:4318',
            'PrinterIp': os.environ.get('PRINTER_IP', '192.168.1.243'),
          }
          if os.environ.get('JWT_SIGNING_KEY_ARN'):
            params['JwtSigningKeyArn'] = os.environ['JWT_SIGNING_KEY_ARN']
          if os.environ.get('WG_PRIVATE_KEY'):
            params['WgPrivateKey'] = os.environ['WG_PRIVATE_KEY']
            params['WgPeerPublicKey'] = os.environ.get('WG_PEER_PUBLIC_KEY', '')
            params['WgPeerEndpoint'] = os.environ.get('WG_PEER_ENDPOINT', '')
            params['WgAddress'] = os.environ.get('WG_ADDRESS', '')
            params['WgDns'] = os.environ.get('WG_DNS', '')
          if os.environ.get('ALEXA_SKILL_ID'):
            params['AlexaSkillId'] = os.environ['ALEXA_SKILL_ID']

          with open('params.yaml', 'w') as f:
            for k, v in params.items():
              f.write(f"{k}: '{v}'\n")
          PYEOF

          sam deploy \
            --template-file template.yaml \
            --stack-name mcp-brother-label-printer-direct-stack \
            --s3-bucket "$CF_BUCKET" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --tags Project=go-mcp-brother-label-printer-direct CostCenter=mcp-servers Environment=prod ManagedBy=sam DeployedVia=github-actions Owner=jeremy \
            --parameter-overrides file://params.yaml

      - name: Output Stack Info
        run: |
          aws cloudformation describe-stacks \
            --stack-name mcp-brother-label-printer-direct-stack \
            --query 'Stacks[0].Outputs' \
            --output table
